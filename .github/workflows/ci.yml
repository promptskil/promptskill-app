name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev, release]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        continue-on-error: true     # remove after Step 0.5

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true     # remove after Step 0.5

      - name: Lint
        run: npm run lint
        continue-on-error: true     # remove after Step 0.5

      - name: Test
        run: npm test -- --watchAll=false
        continue-on-error: true     # remove after Step 0.5
